name: release

# Publish the Docker image for each vX.Y.Z git tag. Public repo: GitHub-hosted
# runners only, DOCKERHUB_* secrets unreadable from forks/PRs. workflow_dispatch
# rebuilds an existing tag whose commit predates this workflow.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (e.g. v1.3.0)"
        required: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # tag push -> the pushed tag; manual run -> the requested tag.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image tag matches the git tag verbatim (v-prefixed).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: vadims06/topolograph-mcp-server:${{ env.TAG }}

      # Move :latest only if THIS tag is the newest stable vX.Y.Z, re-checked
      # after the build so a concurrent or out-of-order newer push wins.
      # Prereleases (a `-` suffix, e.g. v1.4.0-rc1) never take :latest.
      - name: Publish :latest for the newest tag
        run: |
          git fetch --tags --force --prune
          top=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -1)
          if [ "$top" = "$TAG" ]; then
            docker buildx imagetools create \
              -t vadims06/topolograph-mcp-server:latest \
              vadims06/topolograph-mcp-server:${TAG}
          else
            echo "skip :latest — newest stable tag is $top, this build is $TAG"
          fi

  # Lists the tagged version in the official MCP Registry as com.topolograph/*.
  # A manual rebuild re-runs an already listed version, so only tag pushes run it.
  mcp-registry:
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      PUBLISHER_VERSION: v1.8.11
      PUBLISHER_SHA256: 99fbd857ae2277e5e4a4a2cddc7f4d3e64612c6f90950f44584c3539c9df854f
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches server.json version
        run: |
          version=$(jq -r .version server.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG but server.json version is $version"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # The key's public half is served at topolograph.com/.well-known/mcp-registry-auth
      - name: Publish
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login http --domain topolograph.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
